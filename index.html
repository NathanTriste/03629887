<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GHYDAWAY — O Caminho para Yalhes</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =========================
         MENU PRINCIPAL
    ========================== -->

    <main id="menuScreen" class="screen menu-screen">

        <div class="menu-background"></div>

        <div class="menu-content">

            <div class="logo-area">
                <p class="logo-small">UMA HISTÓRIA DE</p>
                <h1>GHYDAWAY</h1>
                <p class="logo-subtitle">
                    Onde a mana decide quem sobrevive.
                </p>
            </div>

            <div class="episode-list">

                <button id="episode1" class="episode-card">

                    <div class="episode-number">
                        EP. 01
                    </div>

                    <div class="episode-info">
                        <h2>O CAMINHO PARA YALHES</h2>
                        <p>
                            Um jovem desconhecido se aproxima do país
                            mais poderoso de Ghydaway.
                        </p>
                    </div>

                    <div class="play-symbol">
                        ▶
                    </div>

                </button>


                <button class="episode-card locked" disabled>

                    <div class="episode-number">
                        EP. 02
                    </div>

                    <div class="episode-info">
                        <h2>EM BREVE</h2>
                        <p>
                            Continue a história para desbloquear.
                        </p>
                    </div>

                    <div class="lock-symbol">
                        🔒
                    </div>

                </button>


                <button class="episode-card locked" disabled>

                    <div class="episode-number">
                        EP. 03
                    </div>

                    <div class="episode-info">
                        <h2>EM BREVE</h2>
                        <p>
                            Continue a história para desbloquear.
                        </p>
                    </div>

                    <div class="lock-symbol">
                        🔒
                    </div>

                </button>

            </div>

            <p class="menu-footer">
                GHYDAWAY © 2026
            </p>

        </div>

    </main>


    <!-- =========================
         TELA DO ANIME
    ========================== -->

    <main id="animeScreen" class="screen anime-screen hidden">

        <canvas id="animeCanvas"></canvas>


        <!-- TÍTULO DO EPISÓDIO -->

        <div id="episodeTitle" class="episode-title">

            <span>EPISÓDIO 01</span>

            <h1>
                O CAMINHO PARA YALHES
            </h1>

        </div>


        <!-- LEGENDA -->

        <div id="subtitleBox" class="subtitle-box">

            <p id="subtitleText"></p>

        </div>


        <!-- CONTROLES -->

        <div class="controls">

            <button id="pauseButton" title="Pausar">
                ❚❚
            </button>

            <button id="muteButton" title="Som">
                🔊
            </button>

            <button id="backButton" title="Voltar">
                ✕
            </button>

        </div>


        <!-- TELA INICIAL DO EPISÓDIO -->

        <div id="startEpisode" class="episode-overlay">

            <div class="overlay-content">

                <span>EPISÓDIO 01</span>

                <h1>
                    O CAMINHO PARA YALHES
                </h1>

                <p>
                    Uma história de Ghydaway.
                </p>

                <button id="startButton">
                    ▶ COMEÇAR
                </button>

            </div>

        </div>


        <!-- PAUSADO -->

        <div id="pausedScreen" class="episode-overlay hidden">

            <div class="overlay-content">

                <span>EPISÓDIO PAUSADO</span>

                <h1>
                    GHYDAWAY
                </h1>

                <button id="resumeButton">
                    ▶ CONTINUAR
                </button>

                <button id="pausedBackButton" class="secondary-button">
                    VOLTAR AO MENU
                </button>

            </div>

        </div>


        <!-- CARREGANDO -->

        <div id="loadingScreen" class="episode-overlay hidden">

            <div class="loading-content">

                <div class="loader"></div>

                <p>
                    CARREGANDO GHYDAWAY...
                </p>

            </div>

        </div>

    </main>


    <script src="./script.js"></script>

</body>
</html>

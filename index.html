<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>GhydAnimate</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =========================
         MENU
    ========================== -->

    <section id="homeScreen" class="home-screen">

        <div class="home-content">

            <div class="logo">
                <span>2D ANIMATION STUDIO</span>
                <h1>GhydAnimate</h1>
                <p>Desenhe. Articule. Anime.</p>
            </div>

            <button id="createButton" class="main-button">
                🎬 CRIAR ANIMAÇÃO
            </button>

            <button id="loadButton" class="secondary-home-button">
                💾 CARREGAR PROJETO
            </button>

            <p class="version">
                V1.0
            </p>

        </div>

    </section>


    <!-- =========================
         EDITOR
    ========================== -->

    <section id="editor" class="editor hidden">

        <!-- BARRA SUPERIOR -->

        <header class="topbar">

            <div class="brand">
                <strong>GhydAnimate</strong>
                <span>V1.0</span>
            </div>

            <div class="top-actions">

                <button id="undoButton" title="Desfazer">
                    ↶
                </button>

                <button id="redoButton" title="Refazer">
                    ↷
                </button>

                <button id="saveButton" title="Salvar">
                    💾
                </button>

                <button id="fullscreenButton" title="Tela inteira">
                    ⛶
                </button>

                <button id="backHomeButton" title="Menu">
                    ✕
                </button>

            </div>

        </header>


        <!-- ÁREA PRINCIPAL -->

        <div class="workspace">


            <!-- FERRAMENTAS -->

            <aside class="toolbar">

                <button
                    class="tool active"
                    data-tool="draw"
                    title="Desenhar"
                >
                    🖌️
                    <span>Desenhar</span>
                </button>

                <button
                    class="tool"
                    data-tool="erase"
                    title="Borracha"
                >
                    🧹
                    <span>Borracha</span>
                </button>

                <button
                    class="tool"
                    data-tool="joint"
                    title="Articulação"
                >
                    🦴
                    <span>Articulação</span>
                </button>

                <button
                    class="tool"
                    data-tool="move"
                    title="Mover"
                >
                    🖐️
                    <span>Mover</span>
                </button>

                <button
                    class="tool"
                    data-tool="select"
                    title="Selecionar"
                >
                    🔲
                    <span>Selecionar</span>
                </button>

                <div class="tool-separator"></div>

                <button
                    id="clearButton"
                    class="tool danger"
                    title="Limpar"
                >
                    🗑️
                    <span>Limpar</span>
                </button>

            </aside>


            <!-- CANVAS -->

            <main class="canvas-area">

                <div class="canvas-toolbar">

                    <div class="canvas-tools-left">

                        <button id="gridButton">
                            ⊞ Grade
                        </button>

                        <button id="onionButton">
                            👻 Onion Skin
                        </button>

                        <button id="captureButton">
                            🎥 Área de captura
                        </button>

                    </div>

                    <div class="canvas-info">

                        <span id="currentFrameLabel">
                            FRAME 0
                        </span>

                    </div>

                </div>


                <div id="canvasContainer" class="canvas-container">

                    <canvas id="animationCanvas"></canvas>

                    <div
                        id="captureBox"
                        class="capture-box hidden"
                    >

                        <div class="capture-label">
                            ÁREA DE EXPORTAÇÃO
                        </div>

                        <div class="resize-handle"></div>

                    </div>

                </div>


                <!-- CONFIGURAÇÕES DO PINCEL -->

                <div class="brush-settings">

                    <label>
                        Tamanho

                        <input
                            id="brushSize"
                            type="range"
                            min="1"
                            max="40"
                            value="5"
                        >

                        <span id="brushSizeLabel">
                            5px
                        </span>
                    </label>

                    <label>
                        Cor

                        <input
                            id="brushColor"
                            type="color"
                            value="#ffffff"
                        >
                    </label>

                </div>

            </main>


            <!-- PAINEL DIREITO -->

            <aside class="right-panel">

                <div class="panel-section">

                    <div class="panel-title">
                        CAMADAS

                        <button id="addLayerButton">
                            +
                        </button>
                    </div>

                    <div id="layersList" class="layers-list">

                        <div class="layer active">
                            <span>👁</span>
                            <strong>Desenho</strong>
                        </div>

                    </div>

                </div>


                <div class="panel-section">

                    <div class="panel-title">
                        ARTICULAÇÕES
                    </div>

                    <div class="joint-info">

                        <p id="jointInfo">
                            Nenhuma articulação selecionada.
                        </p>

                    </div>

                </div>

            </aside>

        </div>


        <!-- =========================
             TIMELINE
        ========================== -->

        <footer class="timeline">

            <div class="timeline-controls">

                <button id="firstFrameButton">
                    ⏮
                </button>

                <button id="previousFrameButton">
                    ◀
                </button>

                <button
                    id="playButton"
                    class="play-button"
                >
                    ▶
                </button>

                <button id="nextFrameButton">
                    ▶
                </button>

                <button id="lastFrameButton">
                    ⏭
                </button>

                <button id="addFrameButton">
                    ＋ FRAME
                </button>

                <button id="deleteFrameButton">
                    − FRAME
                </button>

            </div>


            <div class="timeline-main">

                <div class="frame-number">
                    <span>FRAME</span>
                </div>

                <div
                    id="timelineFrames"
                    class="timeline-frames"
                ></div>

            </div>


            <div class="timeline-settings">

                <label>
                    FPS

                    <input
                        id="fpsInput"
                        type="number"
                        min="1"
                        max="60"
                        value="24"
                    >
                </label>

                <label>
                    Duração

                    <span id="durationLabel">
                        12 frames
                    </span>
                </label>

            </div>

        </footer>

    </section>


    <!-- =========================
         MODAL DE INFORMAÇÃO
    ========================== -->

    <div
        id="message"
        class="message hidden"
    ></div>


    <script src="./script.js"></script>

</body>
</html>
